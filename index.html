<!DOCTYPE html>
<html lang="it">
<head>

<title>Sushi Queen — Menù</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f0ede8;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh}

/* HEADER */
.header{
  background:linear-gradient(160deg,#1a0a0a 0%,#0a0a0a 60%);
  border-bottom:1px solid #3a1010;
  padding:18px 16px 12px;
  text-align:center;
  position:sticky;top:0;z-index:100;
}
.hl{font-size:9px;letter-spacing:7px;color:#c0392b;text-transform:uppercase;margin-bottom:3px}
.header h1{font-size:26px;font-weight:800;color:#fff;letter-spacing:3px}
.hmenu{font-size:10px;letter-spacing:3px;color:#777;text-transform:uppercase;margin-bottom:10px}

/* FILTER BUTTONS */
.filter-row{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.filter-btn{padding:6px 18px;border-radius:20px;border:1px solid #3a1010;background:transparent;color:#888;font-size:12px;cursor:pointer;font-family:inherit;transition:all .18s;font-weight:600}
.filter-btn.active-all{border-color:#c0392b;background:rgba(192,57,43,.15);color:#c0392b}
.filter-btn.active-pranzo{border-color:#e67e22;background:rgba(230,126,34,.12);color:#e67e22}
.filter-btn.active-cena{border-color:#8e44ad;background:rgba(142,68,173,.12);color:#8e44ad}

/* SEARCH */
.sw{margin-top:4px}
.sw input{width:100%;max-width:340px;padding:7px 15px;background:#1a1010;border:1px solid #3a1010;border-radius:24px;color:#f0ede8;font-size:13px;outline:none;font-family:inherit}
.sw input::placeholder{color:#555}

/* TABS */
.tabs{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;background:#060606;border-bottom:1px solid #1a0a0a;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:5px 13px;border-radius:20px;border:1px solid #2a0a0a;background:transparent;color:#777;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .18s}
.tab.active{border-color:#c0392b;background:rgba(192,57,43,.12);color:#c0392b}

/* CONTENT */
.content{padding:14px 14px 100px}
.cat-head{margin-bottom:12px}
.cat-title{font-size:21px;color:#fff;font-weight:700}
.cat-sub{font-size:12px;color:#777;margin-left:6px}
.cat-note{font-size:11px;color:#c0392b;font-style:italic;margin-top:5px}
.cat-line{width:44px;height:2px;background:#c0392b;margin-top:9px}

/* ITEMS */
.item{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid #161010;gap:10px}
.item:last-child{border-bottom:none}
.il{flex:1;min-width:0}
.itop{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.inum{font-size:10px;color:#c0392b;background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.2);padding:1px 5px;border-radius:3px;flex-shrink:0;font-family:monospace}
.iname{font-size:14px;color:#fff;font-weight:600;line-height:1.3}
.bf{font-size:11px;color:#6ab0f5;flex-shrink:0}
.iqty-label{font-size:11px;color:#888;font-style:italic}
.idesc{font-size:12px;color:#666;margin-top:3px;line-height:1.5}
.iprice{color:#c0392b;font-weight:700;font-size:14px;white-space:nowrap;flex-shrink:0}

/* CENA BADGE */
.badge-cena{font-size:9px;color:#8e44ad;border:1px solid rgba(142,68,173,.3);padding:1px 5px;border-radius:3px;flex-shrink:0;letter-spacing:.5px}

/* QTY */
.qty-ctrl{display:flex;align-items:center;flex-shrink:0}
.qty-btn{width:28px;height:28px;border:1px solid #3a1010;background:#1a0a0a;color:#c0392b;font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:background .12s}
.qty-btn:first-child{border-radius:6px 0 0 6px}
.qty-btn:last-child{border-radius:0 6px 6px 0}
.qty-btn:active{background:#2a1010}
.qty-num{width:32px;height:28px;background:#100808;border-top:1px solid #3a1010;border-bottom:1px solid #3a1010;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* CART BTN */
.cart-btn{position:fixed;bottom:20px;right:16px;z-index:200;background:#c0392b;color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 20px rgba(192,57,43,.5);display:none;align-items:center;gap:8px;transition:transform .15s}
.cart-btn:active{transform:scale(.96)}
.cart-badge{background:#fff;color:#c0392b;border-radius:50%;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:900}

/* DRAWER */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300}
.overlay.open{display:block}
.drawer{position:fixed;bottom:0;left:0;right:0;z-index:400;background:#0f0808;border-top:2px solid #3a1010;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.drawer.open{transform:translateY(0)}
.drawer-head{padding:16px 18px 12px;border-bottom:1px solid #1e1010;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0f0808;z-index:1}
.drawer-title{font-size:18px;color:#fff;font-weight:700}
.close-btn{background:none;border:none;color:#777;font-size:22px;cursor:pointer;padding:4px}

/* ORDER TYPE */
.otype{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid #1e1010}
.otype-btn{flex:1;padding:10px 6px;border-radius:8px;border:1px solid #2a1010;background:transparent;color:#777;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.otype-btn.sel{border-color:#c0392b;background:rgba(192,57,43,.12);color:#c0392b;font-weight:700}

/* FORM */
.dform{padding:14px 18px;border-bottom:1px solid #1e1010;display:none}
.dform.visible{display:block}
.fgroup{margin-bottom:12px}
.flabel{font-size:11px;color:#777;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;display:block}
.finput{width:100%;padding:9px 12px;background:#1a1010;border:1px solid #2a1010;border-radius:6px;color:#f0ede8;font-size:14px;font-family:inherit;outline:none}
.finput:focus{border-color:#c0392b}
.finput::placeholder{color:#444}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note-section{padding:0 18px 14px;border-bottom:1px solid #1e1010}

/* CART ITEMS */
.cart-items{padding:14px 18px;border-bottom:1px solid #1e1010}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #161010;gap:10px}
.cart-item:last-child{border-bottom:none}
.ci-left{flex:1}
.ci-name{font-size:13px;color:#fff;font-weight:600}
.ci-sub{font-size:11px;color:#666;margin-top:2px}
.ci-right{display:flex;align-items:center;gap:10px}
.ci-price{color:#c0392b;font-size:13px;font-weight:700;white-space:nowrap}
.ci-rm{background:none;border:none;color:#444;font-size:16px;cursor:pointer;padding:2px 6px;border-radius:4px}
.ci-rm:hover{color:#c0392b}
.cart-empty{text-align:center;color:#444;padding:24px;font-size:13px}

/* TOTAL */
.cart-total{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.total-label{color:#777;font-size:13px}
.total-amount{color:#c0392b;font-size:22px;font-weight:700}

/* BUTTONS */
.wa-btn{display:block;width:calc(100% - 36px);margin:0 18px 18px;padding:13px;background:#25D366;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.wa-btn:disabled{opacity:.4;cursor:not-allowed}

/* PRINT */
#print-area{display:none}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block!important;font-family:Arial,sans-serif;padding:20px}}
#print-area .ph1{text-align:center;border-bottom:2px solid #c0392b;padding-bottom:10px;margin-bottom:14px}
#print-area .ph1 h1{font-size:24px;color:#c0392b;letter-spacing:2px}
#print-area .ph1 .sub{font-size:10px;letter-spacing:4px;color:#888;text-transform:uppercase;margin-top:2px}
#print-area .pmeta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:16px}
#print-area .type-badge{font-size:13px;font-weight:bold;color:#c0392b;border:1.5px solid #c0392b;padding:4px 12px;border-radius:4px;white-space:nowrap}
#print-area .info-row{display:flex;gap:8px;margin-bottom:3px;font-size:11.5px}
#print-area .info-row span:first-child{font-weight:bold;color:#555;min-width:90px}
#print-area .pdt{font-size:10px;color:#aaa;white-space:nowrap}
#print-area table{width:100%;border-collapse:collapse;margin-top:12px}
#print-area thead tr{background:#f5f0f0}
#print-area thead th{padding:7px 8px;text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#888;border-bottom:2px solid #c0392b}
#print-area thead th.r{text-align:right}
#print-area tbody tr{border-bottom:1px solid #eee}
#print-area td{padding:7px 8px;vertical-align:top}
#print-area td.num{color:#c0392b;font-weight:bold;font-size:11px;white-space:nowrap;width:36px}
#print-area td.qty{text-align:right;white-space:nowrap;width:50px;color:#555}
#print-area td.price{text-align:right;white-space:nowrap;width:80px;font-weight:bold}
#print-area .subdesc{font-size:10px;color:#999;margin-top:2px;font-style:italic}
#print-area .total-row{display:flex;justify-content:space-between;align-items:center;border-top:2px solid #c0392b;margin-top:10px;padding-top:10px}
#print-area .total-label{font-size:15px;font-weight:bold}
#print-area .total-amount{font-size:22px;font-weight:bold;color:#c0392b}
#print-area .pfooter{text-align:center;margin-top:18px;font-size:9.5px;color:#aaa;border-top:1px solid #eee;padding-top:10px}

/* THEME TOGGLE */
.theme-toggle{position:fixed;top:14px;right:14px;z-index:150;background:rgba(192,57,43,.15);border:1px solid #3a1010;border-radius:20px;padding:5px 10px;cursor:pointer;font-size:16px;color:#c0392b;transition:all .2s}

/* LIGHT MODE */
body.light{background:#fafafa;color:#1a0808}
body.light .header{background:linear-gradient(160deg,#fff0f0 0%,#fafafa 60%);border-bottom-color:#e0c0c0}
body.light .hl{color:#c0392b}
body.light .header h1{color:#1a0808}
body.light .filter-btn{border-color:#e0c0c0;color:#aaa}
body.light .sw input{background:#fff;border-color:#e0c0c0;color:#1a0808}
body.light .tabs{background:#fff5f5;border-bottom-color:#f0e0e0}
body.light .tab{border-color:#e0c0c0;color:#aaa}
body.light .tab.active{border-color:#c0392b;background:rgba(192,57,43,.08);color:#c0392b}
body.light .item{border-bottom-color:#f0e0e0}
body.light .inum{color:#c0392b;background:rgba(192,57,43,.06);border-color:rgba(192,57,43,.15)}
body.light .iname{color:#1a0808}
body.light .idesc{color:#999}
body.light .iprice{color:#c0392b}
body.light .qty-btn{border-color:#e0c0c0;background:#fff;color:#c0392b}
body.light .qty-num{background:#fff5f5;border-color:#e0c0c0;color:#1a0808}
body.light .drawer{background:#fffafa}
body.light .drawer-head{background:#fffafa;border-bottom-color:#f0e0e0}
body.light .drawer-title{color:#1a0808}
body.light .otype-btn{border-color:#e0c0c0;color:#aaa}
body.light .otype-btn.sel{border-color:#c0392b;background:rgba(192,57,43,.08);color:#c0392b}
body.light .finput{background:#fff;border-color:#e0c0c0;color:#1a0808}
body.light .flabel{color:#aaa}
body.light .cart-item{border-bottom-color:#f0e0e0}
body.light .ci-name{color:#1a0808}
body.light .total-label{color:#aaa}
body.light .total-amount{color:#c0392b}
body.light .cart-items{border-bottom-color:#f0e0e0}
body.light .note-section{border-bottom-color:#f0e0e0}
body.light .footer{border-top-color:#f0e0e0;color:#ccc}
body.light .theme-toggle{background:rgba(192,57,43,.08);border-color:#e0c0c0}

.footer{text-align:center;padding:22px 16px;border-top:1px solid #1a0a0a;color:#444;font-size:11px;line-height:2}
.footer strong{color:#666}
</style>

// ═══════════ FILTER ═══════════
function getFilteredItems(catItems){
  if(filterMode === "cena") return catItems.filter(function(i){ return i.cena === 1; });
  if(filterMode === "pranzo") return catItems.filter(function(i){ return i.cena === 0; });
  return catItems;
}

// ═══════════ KEYS ═══════════
function itemKey(it){ return it.n+"|"+it.name; }
function getQty(it){ var k=itemKey(it); return cart[k]?cart[k].qty:0; }

// ═══════════ ITEM HTML ═══════════
function itemHTML(it){
  var k=itemKey(it), uid=k.replace(/[^a-z0-9]/gi,"_"), q=getQty(it);
  itemRegistry[k]=it;
  return '<div class="item">'+
    '<div class="il">'+
      '<div class="itop">'+
        '<span class="inum">'+it.n+'</span>'+
        '<span class="iname">'+it.name+'</span>'+
        (it.f?'<span class="bf">❄</span>':'')+
        (it.cena?'<span class="badge-cena">🌙 Cena</span>':'')+
      '</div>'+
      (it.desc?'<div class="idesc">'+it.desc+'</div>':'')+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
      '<span class="iprice">'+it.ps+'</span>'+
      '<div class="qty-ctrl">'+
        '<button class="qty-btn" data-k="'+k+'" data-d="-1">&#8722;</button>'+
        '<div class="qty-num" id="qn_'+uid+'">'+q+'</div>'+
        '<button class="qty-btn" data-k="'+k+'" data-d="1">+</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

// ═══════════ RENDER TABS ═══════════
function RT(){
  document.getElementById("TB").innerHTML = menu.map(function(c){
    return '<button class="tab'+(c.id===cur?' active':'')+'" data-id="'+c.id+'">'+c.icon+' '+c.label+'</button>';
  }).join("");
}

// ═══════════ RENDER CATEGORY ═══════════
function RC(){
  var c = menu.find(function(x){ return x.id===cur; });
  var items = getFilteredItems(c.items);
  document.getElementById("CT").innerHTML =
    '<div class="cat-head">'+
      '<div><span class="cat-title">'+c.icon+' '+c.label+'</span>'+
      (c.subtitle?'<span class="cat-sub">('+c.subtitle+')</span>':'')+
      '</div>'+(c.note?'<div class="cat-note">'+c.note+'</div>':'')+
      '<div class="cat-line"></div></div>'+
    (items.length ? items.map(itemHTML).join("") : '<div class="nr">Nessun piatto disponibile con questo filtro</div>');
}

function SC(id){ cur=id; document.getElementById("SI").value=""; document.getElementById("TB").style.display="flex"; RT(); RC(); window.scrollTo(0,0); }

function doSearch(v){
  var tb=document.getElementById("TB");
  if(!v.trim()){ tb.style.display="flex"; RC(); return; }
  tb.style.display="none";
  var q=v.toLowerCase().trim();
  var res=menu.reduce(function(a,c){
    return a.concat(getFilteredItems(c.items).filter(function(i){
      return i.name.toLowerCase().indexOf(q)>=0||i.desc.toLowerCase().indexOf(q)>=0||i.n.toLowerCase().indexOf(q)>=0;
    }));
  },[]);
  document.getElementById("CT").innerHTML=
    '<div class="si">'+res.length+' risultati per "'+v+'"</div>'+
    (res.length?res.map(itemHTML).join(""):'<div class="nr">Nessun piatto trovato</div>');
}

// ═══════════ FILTER BUTTONS ═══════════
function setFilter(mode){
  filterMode = mode;
  document.getElementById("f-tutti").className   = "filter-btn"+(mode==="tutti"?" active-all":"");
  document.getElementById("f-pranzo").className  = "filter-btn"+(mode==="pranzo"?" active-pranzo":"");
  document.getElementById("f-cena").className    = "filter-btn"+(mode==="cena"?" active-cena":"");
  var v = document.getElementById("SI").value;
  if(v.trim()) doSearch(v); else RC();
}

// ═══════════ CART ═══════════
function changeQty(k,item,delta){
  if(!cart[k]) cart[k]={item:item,qty:0};
  cart[k].qty=Math.max(0,cart[k].qty+delta);
  if(cart[k].qty===0) delete cart[k];
  var el=document.getElementById("qn_"+k.replace(/[^a-z0-9]/gi,"_"));
  if(el) el.textContent=cart[k]?cart[k].qty:0;
  updateCartUI();
}
function removeFromCart(k){
  delete cart[k];
  var el=document.getElementById("qn_"+k.replace(/[^a-z0-9]/gi,"_"));
  if(el) el.textContent=0;
  updateCartUI(); renderCartItems();
}
function updateCartUI(){
  var entries=Object.values(cart);
  var total=entries.reduce(function(s,e){return s+e.item.price*e.qty;},0);
  var count=entries.reduce(function(s,e){return s+e.qty;},0);
  document.getElementById("cartBadge").textContent=count;
  document.getElementById("cartBtn").style.display=count>0?"flex":"none";
  document.getElementById("cartBtnTxt").textContent=count>0?"Ordine ("+total.toFixed(2).replace(".",",")+" €)":"Ordine";
  document.getElementById("cartTotal").textContent="€ "+total.toFixed(2).replace(".",",");
  var wb=document.getElementById("waBtn"); if(wb) wb.disabled=count===0;
  if(document.getElementById("drawer").classList.contains("open")) renderCartItems();
}
function renderCartItems(){
  var entries=Object.values(cart), el=document.getElementById("cartItems");
  if(!entries.length){el.innerHTML='<div class="cart-empty">Nessun piatto aggiunto</div>';return;}
  el.innerHTML=entries.map(function(e){
    var k=itemKey(e.item);
    return '<div class="cart-item">'+
      '<div class="ci-left">'+
        '<div class="ci-name"><span style="color:#c0392b;font-size:11px;margin-right:4px">'+e.item.n+'</span>'+e.item.name+'</div>'+
        '<div class="ci-sub">x'+e.qty+' &middot; '+(e.item.price*e.qty).toFixed(2).replace(".",",")+'&euro;</div>'+
        (e.item.desc?'<div style="font-size:10px;color:#555;margin-top:2px;line-height:1.4">'+e.item.desc+'</div>':'')+
      '</div>'+
      '<div class="ci-right"><span class="ci-price">'+e.item.ps+'</span>'+
        '<button class="ci-rm" data-rm="'+k+'">&#10005;</button></div>'+
    '</div>';
  }).join("");
  el.querySelectorAll("[data-rm]").forEach(function(btn){
    btn.addEventListener("click",function(){removeFromCart(btn.dataset.rm);});
  });
}

// ═══════════ DRAWER ═══════════
function openDrawer(){ renderCartItems(); document.getElementById("drawer").classList.add("open"); document.getElementById("overlay").classList.add("open"); document.body.style.overflow="hidden"; }
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("overlay").classList.remove("open"); document.body.style.overflow=""; }
function setType(t){
  orderType=t;
  ["asporto","domicilio"].forEach(function(x){
    document.getElementById("bt-"+x).classList.toggle("sel",x===t);
    document.getElementById("form-"+x).classList.toggle("visible",x===t);
  });
}

// ═══════════ ORDER DATA ═══════════
function buildOrderData(){
  var entries=Object.values(cart);
  var total=entries.reduce(function(s,e){return s+e.item.price*e.qty;},0);
  var info={};
  if(orderType==="asporto"){
    info.nome=document.getElementById("f-nome-asp").value.trim();
    info.tel=document.getElementById("f-tel-asp").value.trim();
    info.ora=document.getElementById("f-ora-asp").value;
  } else {
    info.nome=document.getElementById("f-nome-dom").value.trim();
    info.tel=document.getElementById("f-tel-dom").value.trim();
    info.via=document.getElementById("f-via").value.trim();
    info.citta=document.getElementById("f-citta").value.trim();
    info.piano=document.getElementById("f-piano").value.trim();
    info.ora=document.getElementById("f-ora-dom").value;
  }
  info.note=document.getElementById("f-note").value.trim();
  return {orderType:orderType,info:info,entries:entries.map(function(e){return {n:e.item.n,name:e.item.name,qty:e.qty,price:e.item.price,desc:e.item.desc||""};}),total:total,status:"nuovo"};
}

// ═══════════ WHATSAPP ═══════════
function sendWhatsApp(){
  var data=buildOrderData();
  var tl={asporto:"🥡 ASPORTO",domicilio:"🛵 DOMICILIO"}[data.orderType];
  var lines=["*Sushi Queen — Ordine*","*"+tl+"*",""];
  var i=data.info;
  if(i.nome) lines.push("Nome: *"+i.nome+"*");
  if(i.tel)  lines.push("Tel: "+i.tel);
  if(i.via)  lines.push("Indirizzo: "+[i.via,i.citta,i.piano].filter(Boolean).join(", "));
  if(i.ora)  lines.push("Orario: "+i.ora);
  if(i.note) lines.push("Note: "+i.note);
  lines.push("");
  lines.push("*Piatti:*");
  data.entries.forEach(function(e){ lines.push("- ["+e.n+"] "+e.name+" x"+e.qty+" — EUR "+(e.price*e.qty).toFixed(2)); });
  lines.push("");
  lines.push("*TOTALE: EUR "+data.total.toFixed(2)+"*");
  lines.push(new Date().toLocaleString("it-IT"));
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(lines.join("\n")),"_blank");
}

function sendOrder(){ window.sendOrderFB && window.sendOrderFB(buildOrderData()); sendWhatsApp(); }

// ═══════════ THEME ═══════════
function initTheme(){ if(localStorage.getItem("queen-theme")==="light"){ document.body.classList.add("light"); document.getElementById("themeToggle").textContent="☀️"; } }
function toggleTheme(){ var l=document.body.classList.toggle("light"); document.getElementById("themeToggle").textContent=l?"☀️":"🌙"; localStorage.setItem("queen-theme",l?"light":"dark"); }

// ═══════════ INIT ═══════════
document.addEventListener("DOMContentLoaded",function(){
  document.getElementById("TB").addEventListener("click",function(e){ var b=e.target.closest("[data-id]"); if(b) SC(b.dataset.id); });
  document.getElementById("SI").addEventListener("input",function(){ doSearch(this.value); });
  document.getElementById("cartBtn").addEventListener("click",openDrawer);
  document.getElementById("drawerClose").addEventListener("click",closeDrawer);
  document.getElementById("overlay").addEventListener("click",closeDrawer);
  document.getElementById("bt-asporto").addEventListener("click",function(){setType("asporto");});
  document.getElementById("bt-domicilio").addEventListener("click",function(){setType("domicilio");});
  document.getElementById("waBtn").addEventListener("click",function(){ sendOrder(); });
  document.getElementById("themeToggle").addEventListener("click",toggleTheme);
  document.getElementById("f-tutti").addEventListener("click",function(){setFilter("tutti");});
  document.getElementById("f-pranzo").addEventListener("click",function(){setFilter("pranzo");});
  document.getElementById("f-cena").addEventListener("click",function(){setFilter("cena");});
  document.addEventListener("click",function(e){ var b=e.target.closest("[data-k][data-d]"); if(!b) return; var k=b.dataset.k,d=parseInt(b.dataset.d,10),it=itemRegistry[k]; if(it) changeQty(k,it,d); });
  window.RC=RC; window.menu=menu; window.buildOrderData=buildOrderData;
  initTheme(); RT(); RC();
});
</script>
