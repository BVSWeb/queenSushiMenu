<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sushi Queen — Gestione Menù</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f0ede8;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh}

#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px}
#login-screen h1{font-size:28px;color:#c0392b;letter-spacing:3px;font-weight:800}
#login-screen p{font-size:12px;color:#555;letter-spacing:2px;text-transform:uppercase}
#pin-input{width:180px;padding:14px;text-align:center;font-size:28px;letter-spacing:10px;background:#1a0808;border:2px solid #3a1010;border-radius:10px;color:#fff;outline:none;font-family:monospace}
#pin-input:focus{border-color:#c0392b}
#pin-err{color:#e74c3c;font-size:13px;min-height:18px}
.login-btn{padding:12px 32px;background:#c0392b;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}

#main{display:none;flex-direction:column;min-height:100vh}
.top-bar{background:#160808;border-bottom:1px solid #3a1010;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:17px;color:#c0392b;letter-spacing:1px;font-weight:800}
.top-bar-right{display:flex;gap:8px;align-items:center}
.add-btn{padding:8px 16px;background:#c0392b;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.seed-btn{padding:7px 12px;background:none;border:1px solid #3a1010;color:#c0392b;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.logout-btn{padding:7px 14px;background:none;border:1px solid #3a1010;color:#666;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.sync-badge{font-size:11px;color:#27ae60;margin-left:8px}
.sync-badge.err{color:#e74c3c}

.cat-tabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;background:#060606;border-bottom:1px solid #1a0808;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid #2a0808;background:transparent;color:#666;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.cat-tab.active{border-color:#c0392b;background:rgba(192,57,43,.12);color:#c0392b}

.items-wrap{flex:1;padding:14px 16px}
.item-row{background:#160808;border:1px solid #1e0808;border-radius:10px;margin-bottom:10px;overflow:hidden;transition:opacity .2s}
.item-row.sospeso{opacity:.4}
.item-head{display:flex;align-items:center;padding:12px 14px;gap:10px}
.item-num{font-size:10px;color:#c0392b;background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.2);padding:2px 6px;border-radius:3px;font-family:monospace;flex-shrink:0}
.item-name{flex:1;font-size:14px;color:#fff;font-weight:600}
.item-price{color:#c0392b;font-weight:700;font-size:14px;flex-shrink:0}
.item-desc{padding:0 14px 8px;font-size:12px;color:#555;line-height:1.5}
.item-actions{display:flex;gap:6px;padding:8px 14px;border-top:1px solid #1a0808;justify-content:flex-end;flex-wrap:wrap}
.act-btn{padding:5px 12px;border-radius:6px;border:1px solid #2a0808;background:transparent;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.act-edit{color:#3498db;border-color:#0a2030}
.act-edit:hover{background:rgba(52,152,219,.1)}
.act-suspend{color:#e67e22;border-color:#301808}
.act-suspend:hover{background:rgba(230,126,34,.08)}
.act-delete{color:#e74c3c;border-color:#300808}
.act-delete:hover{background:rgba(231,76,60,.08)}
.badge-sospeso{font-size:10px;color:#e67e22;border:1px solid rgba(230,126,34,.3);padding:1px 6px;border-radius:3px;margin-left:4px}
.badge-cena{font-size:9px;color:#8e44ad;border:1px solid rgba(142,68,173,.3);padding:1px 5px;border-radius:3px;margin-left:4px}

#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:flex-end;justify-content:center}
#modal-overlay.open{display:flex}
#modal{background:#100808;border-top:2px solid #3a1010;border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:20px}
.modal-title{font-size:18px;color:#fff;font-weight:700;margin-bottom:18px}
.fgroup{margin-bottom:14px}
.flabel{font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;display:block}
.finput,.fselect,.ftextarea{width:100%;padding:10px 12px;background:#1a0808;border:1px solid #2a1010;border-radius:6px;color:#f0ede8;font-size:14px;font-family:inherit;outline:none}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:#c0392b}
.ftextarea{resize:vertical;min-height:60px}
.fselect option{background:#1a0808}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-save{flex:1;padding:12px;background:#c0392b;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.modal-cancel{padding:12px 20px;background:none;border:1px solid #3a1010;color:#666;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty-msg{text-align:center;color:#444;padding:48px;font-size:14px}
</style>
</head>
<body>

<div id="login-screen">
  <h1>Sushi Queen</h1>
  <p>Gestione Menù</p>
  <input id="pin-input" type="password" maxlength="20" placeholder="••••">
  <div id="pin-err"></div>
  <button class="login-btn" id="login-btn">Accedi</button>
</div>

<div id="main">
  <div class="top-bar">
    <h1>🍣 Gestione Menù <span class="sync-badge" id="sync-badge"></span></h1>
    <div class="top-bar-right">
      <button class="seed-btn" id="seed-btn">⬇️ Carica piatti</button>
      <button class="add-btn" id="add-btn">+ Nuovo piatto</button>
      <button class="logout-btn" id="logout-btn">Esci</button>
    </div>
  </div>
  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="items-wrap" id="items-wrap"><div class="empty-msg">Caricamento...</div></div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <div class="modal-title" id="modal-title">Nuovo piatto</div>
    <div class="frow">
      <div class="fgroup"><label class="flabel">Numero (es. 42)</label><input class="finput" id="f-n" type="text"></div>
      <div class="fgroup"><label class="flabel">Prezzo (€)</label><input class="finput" id="f-price" type="number" step="0.50" min="0"></div>
    </div>
    <div class="fgroup"><label class="flabel">Nome piatto</label><input class="finput" id="f-name" type="text"></div>
    <div class="fgroup"><label class="flabel">Descrizione / Ingredienti</label><textarea class="ftextarea" id="f-desc"></textarea></div>
    <div class="frow">
      <div class="fgroup"><label class="flabel">Categoria</label><select class="fselect" id="f-cat"></select></div>
      <div class="fgroup"><label class="flabel">Disponibilità</label>
        <select class="fselect" id="f-cena">
          <option value="0">Pranzo e Cena</option>
          <option value="1">Solo Cena</option>
        </select>
      </div>
    </div>
    <div class="fgroup"><label class="flabel">Surgelato *</label>
      <select class="fselect" id="f-frozen"><option value="0">No</option><option value="1">Sì *</option></select>
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" id="modal-cancel">Annulla</button>
      <button class="modal-save" id="modal-save">Salva</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch }
                            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const fb  = initializeApp({
  apiKey:"AIzaSyB-GfcZwqK3tROLRren9jAm5uSpVJgC2T0",
  authDomain:"queen-sushi-potenza.firebaseapp.com",
  projectId:"queen-sushi-potenza",
  storageBucket:"queen-sushi-potenza.firebasestorage.app",
  messagingSenderId:"4358790106",
  appId:"1:4358790106:web:2d14f2eaf9add0029cbee3"
});
const db   = getFirestore(fb);
const auth = getAuth(fb);
const ADMIN_EMAIL = "admin@sushiqueen.it"; // cambia con la tua email Firebase Auth

const CATS = [
  {id:"antipasti",  label:"Antipasti e Tempura",  icon:"🥢"},
  {id:"tempura",    label:"Tempura e Insalata",    icon:"🥗"},
  {id:"zuppe",      label:"Zuppe",                 icon:"🍜"},
  {id:"primi",      label:"Riso e Pasta",          icon:"🍚"},
  {id:"ramen",      label:"Ramen",                 icon:"🍝"},
  {id:"teppanyaki", label:"Teppanyaki",            icon:"🔥"},
  {id:"pollo",      label:"Pollo",                 icon:"🍗"},
  {id:"gamberi",    label:"Gamberi",               icon:"🦐"},
  {id:"manzo",      label:"Manzo",                 icon:"🥩"},
  {id:"anatra",     label:"Anatra",                icon:"🦆"},
  {id:"maiale",     label:"Maiale",                icon:"🐷"},
  {id:"verdure",    label:"Verdure",               icon:"🥦"},
  {id:"casseruola", label:"Casseruola",            icon:"🫕"},
  {id:"nigiri",     label:"Nigiri",                icon:"🍣"},
  {id:"gunkan",     label:"Gunkan",                icon:"🌊"},
  {id:"temaki",     label:"Temaki",                icon:"🌮"},
  {id:"hosomaki",   label:"Hosomaki",              icon:"🌀"},
  {id:"uramaki",    label:"Uramaki",               icon:"🎯"},
  {id:"futomaki",   label:"Futo Maki",             icon:"🎌"},
  {id:"sushi-misto",label:"Sushi Misto",           icon:"🍱"},
  {id:"sashimi",    label:"Sashimi",               icon:"🐟"},
  {id:"tartare",    label:"Tartare",               icon:"🫙"},
  {id:"tataki",     label:"Tataki",                icon:"🌡️"},
  {id:"carpaccio",  label:"Carpaccio",             icon:"🍽️"},
  {id:"chirashi",   label:"Chirashi",              icon:"🎋"},
  {id:"sandwich",   label:"Sandwich",              icon:"🥪"},
  {id:"onigiri",    label:"Onigiri",               icon:"🍙"},
  {id:"speciale",   label:"Speciale",              icon:"⭐"},
  {id:"speciali",   label:"Speciali",              icon:"✨"},
];

let allItems=[],curCat="antipasti",editId=null,unsub=null;

onAuthStateChanged(auth, user => {
  if(user){
    document.getElementById("login-screen").style.display="none";
    document.getElementById("main").style.display="flex";
    buildCatTabs(); seedIfEmpty().then(()=>startSync());
  } else {
    if(unsub){unsub();unsub=null;}
    document.getElementById("main").style.display="none";
    document.getElementById("login-screen").style.display="flex";
    document.getElementById("pin-input").value="";
    document.getElementById("pin-err").textContent="";
  }
});

document.getElementById("pin-input").addEventListener("input",()=>{ document.getElementById("pin-err").textContent=""; });
async function handleLogin(){
  const pw=document.getElementById("pin-input").value.trim();
  if(!pw){document.getElementById("pin-err").textContent="Inserisci la password";return;}
  try{
    document.getElementById("login-btn").textContent="Accesso...";
    await signInWithEmailAndPassword(auth,ADMIN_EMAIL,pw);
  }catch(e){
    document.getElementById("pin-err").textContent="Password errata";
    document.getElementById("pin-input").value="";
    document.getElementById("login-btn").textContent="Accedi";
  }
}
document.getElementById("login-btn").addEventListener("click",handleLogin);
document.getElementById("pin-input").addEventListener("keydown",e=>{if(e.key==="Enter")handleLogin();});
document.getElementById("logout-btn").addEventListener("click",()=>signOut(auth));

function buildCatTabs(){
  document.getElementById("cat-tabs").innerHTML=CATS.map(c=>
    `<button class="cat-tab${c.id===curCat?" active":""}" data-cat="${c.id}">${c.icon} ${c.label}</button>`
  ).join("");
  document.getElementById("cat-tabs").addEventListener("click",e=>{
    const b=e.target.closest("[data-cat]"); if(!b) return;
    curCat=b.dataset.cat;
    document.querySelectorAll(".cat-tab").forEach(x=>x.classList.toggle("active",x.dataset.cat===curCat));
    renderItems();
  });
}

function startSync(){
  if(unsub) unsub();
  setSyncBadge("⏳ sync..."); 
  unsub=onSnapshot(collection(db,"menu"),snap=>{
    allItems=snap.docs.map(d=>({docId:d.id,...d.data()}));
    allItems.sort((a,b)=>{
      const ci=CATS.findIndex(c=>c.id===a.catId)-CATS.findIndex(c=>c.id===b.catId);
      return ci!==0?ci:String(a.n).localeCompare(String(b.n),undefined,{numeric:true});
    });
    setSyncBadge("● live");
    renderItems();
  },err=>setSyncBadge("✗ offline",true));
}

function setSyncBadge(t,e){
  const b=document.getElementById("sync-badge");
  b.textContent=t; b.className="sync-badge"+(e?" err":"");
}

function renderItems(){
  const wrap=document.getElementById("items-wrap");
  const filtered=allItems.filter(i=>i.catId===curCat);
  if(!filtered.length){wrap.innerHTML='<div class="empty-msg">Nessun piatto in questa categoria.<br>Clicca "+ Nuovo piatto" per aggiungerne uno.</div>';return;}
  wrap.innerHTML=filtered.map(it=>`
    <div class="item-row${it.sospeso?" sospeso":""}">
      <div class="item-head">
        <span class="item-num">${it.n}</span>
        <span class="item-name">${it.name}${it.sospeso?'<span class="badge-sospeso">SOSPESO</span>':''}${it.cena?'<span class="badge-cena">🌙 Solo Cena</span>':''}</span>
        ${it.f?'<span style="color:#6ab0f5;font-size:12px">*</span>':''}
        <span class="item-price">€ ${Number(it.price).toFixed(2).replace(".",",")}</span>
      </div>
      ${it.desc?`<div class="item-desc">${it.desc}</div>`:''}
      <div class="item-actions">
        <button class="act-btn act-edit" data-action="edit" data-doc="${it.docId}">✏️ Modifica</button>
        <button class="act-btn act-suspend" data-action="suspend" data-doc="${it.docId}">${it.sospeso?"▶️ Riattiva":"⏸ Sospendi"}</button>
        <button class="act-btn act-delete" data-action="delete" data-doc="${it.docId}">🗑 Elimina</button>
      </div>
    </div>`).join("");
  wrap.querySelectorAll("[data-action]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const item=allItems.find(i=>i.docId===btn.dataset.doc); if(!item) return;
      if(btn.dataset.action==="edit") openModal(item);
      if(btn.dataset.action==="suspend") toggleSuspend(item);
      if(btn.dataset.action==="delete") confirmDelete(item);
    });
  });
}

async function toggleSuspend(item){
  try{ await updateDoc(doc(db,"menu",item.docId),{sospeso:!item.sospeso}); showToast(item.sospeso?"Riattivato":"Sospeso"); }
  catch(e){ alert("Errore: "+e.message); }
}
function confirmDelete(item){
  if(!confirm('Eliminare "'+item.name+'"?')) return;
  deleteDoc(doc(db,"menu",item.docId)).then(()=>showToast("Eliminato")).catch(e=>alert("Errore: "+e.message));
}

function populateCatSelect(){
  document.getElementById("f-cat").innerHTML=CATS.map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join("");
}
document.getElementById("add-btn").addEventListener("click",()=>openModal(null));
document.getElementById("seed-btn").addEventListener("click",async()=>{
  if(!confirm("Caricare tutti i piatti di default su Firebase?")) return;
  setSyncBadge("⏳ caricamento...");
  await seedIfEmpty(true);
});
document.getElementById("modal-cancel").addEventListener("click",closeModal);
document.getElementById("modal-overlay").addEventListener("click",e=>{ if(e.target===document.getElementById("modal-overlay")) closeModal(); });
document.getElementById("modal-save").addEventListener("click",saveItem);

function openModal(item){
  populateCatSelect();
  editId=item?item.docId:null;
  document.getElementById("modal-title").textContent=item?"Modifica piatto":"Nuovo piatto";
  document.getElementById("f-n").value=item?item.n:"";
  document.getElementById("f-name").value=item?item.name:"";
  document.getElementById("f-desc").value=item?(item.desc||""):"";
  document.getElementById("f-price").value=item?item.price:"";
  document.getElementById("f-cena").value=item?(item.cena?"1":"0"):"0";
  document.getElementById("f-frozen").value=item?(item.f?"1":"0"):"0";
  document.getElementById("f-cat").value=item?item.catId:curCat;
  document.getElementById("modal-overlay").classList.add("open");
  document.getElementById("f-name").focus();
}
function closeModal(){ document.getElementById("modal-overlay").classList.remove("open"); editId=null; }
async function saveItem(){
  const n=document.getElementById("f-n").value.trim();
  const name=document.getElementById("f-name").value.trim();
  const price=parseFloat(document.getElementById("f-price").value);
  const desc=document.getElementById("f-desc").value.trim();
  const cena=document.getElementById("f-cena").value==="1"?1:0;
  const f=document.getElementById("f-frozen").value==="1"?1:0;
  const catId=document.getElementById("f-cat").value;
  if(!n||!name||isNaN(price)){alert("Numero, nome e prezzo sono obbligatori.");return;}
  const data={n,name,price,desc,f,cena,catId,sospeso:false,ps:"€ "+price.toFixed(2).replace(".",",")};
  try{
    if(editId){
      const ex=allItems.find(i=>i.docId===editId); data.sospeso=ex?ex.sospeso:false;
      await updateDoc(doc(db,"menu",editId),data); showToast("Aggiornato ✅");
    } else {
      await setDoc(doc(db,"menu",catId+"_"+String(n).replace(/[^a-z0-9]/gi,"_")),data); showToast("Aggiunto ✅");
    }
    closeModal();
  }catch(e){ alert("Errore: "+e.message); }
}

function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

async function seedIfEmpty(force){
  const snap=await getDocs(collection(db,"menu"));
  if(!snap.empty&&!force) return;
  setSyncBadge("⏳ caricamento dati...");
  const SEED_MENU=[
  {id:"antipasti",label:"Antipasti e Tempura",icon:"🥢",items:[
    {n:"01",name:"Harumaki 2pz",desc:"Involtini di verdure",price:2.5,ps:"€ 2,50",f:0,cena:0},
    {n:"02",name:"Harumaki Ebi 2pz",desc:"Involtini di gamberi* e verdure",price:3.0,ps:"€ 3,00",f:1,cena:0},
    {n:"03",name:"Edamame",desc:"Baccelli di soia*",price:3.0,ps:"€ 3,00",f:1,cena:0},
    {n:"04",name:"Pane Vapole 2pz",desc:"",price:2.0,ps:"€ 2,00",f:0,cena:0},
    {n:"05",name:"Nuvolette di Gamberi",desc:"Chips di gamberi*",price:2.0,ps:"€ 2,00",f:1,cena:0},
    {n:"06",name:"Gyoza* 3pz",desc:"Ravioli di carne",price:3.5,ps:"€ 3,50",f:1,cena:0},
    {n:"07",name:"Gyoza Yasai* 3pz",desc:"Ravioli di verdura funghi e pasta di soia",price:3.0,ps:"€ 3,00",f:1,cena:0},
    {n:"08",name:"Gyoza* Griglia 3pz",desc:"Ravioli di carne",price:3.5,ps:"€ 3,50",f:1,cena:0},
    {n:"09",name:"Gyoza Cristallo 3pz",desc:"Ravioli di gamberi*",price:3.5,ps:"€ 3,50",f:1,cena:0},
    {n:"10",name:"Ebi Xiaomai 3pz",desc:"Ravioli di gamberi* e carne",price:3.5,ps:"€ 3,50",f:1,cena:0},
    {n:"11",name:"Baozi* 2pz",desc:"Carne di suini",price:2.5,ps:"€ 2,50",f:1,cena:0},
    {n:"12",name:"Pane Fritto 2pz",desc:"",price:2.0,ps:"€ 2,00",f:0,cena:0},
    {n:"13",name:"Patatine Fritto",desc:"",price:3.0,ps:"€ 3,00",f:0,cena:0},
    {n:"16",name:"Fagottini Fritti 2pz",desc:"Fagottini di gamberi* e verdure",price:4.0,ps:"€ 4,00",f:1,cena:0},
    {n:"17",name:"Tempura Yasai",desc:"Verdure miste fritte",price:4.0,ps:"€ 4,00",f:0,cena:0},
    {n:"18",name:"Tempura Ebi 3pz",desc:"Gamberoni* fritti",price:7.0,ps:"€ 7,00",f:1,cena:0},
    {n:"14",name:"Bocconcini di Ebi 2pz",desc:"Bocconcini di patate con gamberi*",price:4.5,ps:"€ 4,50",f:1,cena:1},
    {n:"15",name:"Tako Yaki 2pz",desc:"Polpo* e verdure miste",price:4.0,ps:"€ 4,00",f:1,cena:1},
  ]},
  {id:"tempura",label:"Tempura e Insalata",icon:"🥗",items:[
    {n:"19",name:"Tempura Ika",desc:"Calamaro* fritto",price:6.0,ps:"€ 6,00",f:1,cena:0},
    {n:"21",name:"Goma Wakame",desc:"Insalata di alghe e sesamo",price:3.0,ps:"€ 3,00",f:0,cena:0},
    {n:"22",name:"Insalata di Salmone",desc:"Insalata salmone* salsa e sesamo",price:6.0,ps:"€ 6,00",f:1,cena:0},

      b.set(doc(db,"menu",cat.id+"_"+String(it.n).replace(/[^a-z0-9]/gi,"_")),{

      });
